# TLS terminator for the LTI demo stand. Both host names resolve to this container on the
# `lti` network (aliases in docker-compose.yml), so server-to-server calls between Moodle and the
# platform go through the very same HTTPS endpoints a browser uses.
# Upstreams are re-resolved through docker's DNS (variables in proxy_pass below): a restarted
# container gets a new address and a static upstream would answer 502 until nginx is reloaded.
resolver 127.0.0.11 valid=5s ipv6=off;
client_max_body_size 512m;
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_read_timeout 300s;

ssl_certificate     /certs/server.crt;
ssl_certificate_key /certs/server.key;
ssl_protocols       TLSv1.2 TLSv1.3;

server {
    listen 80 default_server;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name moodle.lti.test;
    set $up http://moodle:8080;
    location / { proxy_pass $up; }
}

server {
    listen 443 ssl;
    server_name lab.lti.test;
    set $up http://platform-web:80;
    location / { proxy_pass $up; }
}
