# docker-compose.yml
# Запуск:      docker compose up --build -d
# Остановка:   docker compose down
# Сброс БД:    docker compose down -v
# Логи:        docker compose logs -f

services:

  # ── PostgreSQL ──────────────────────────────────────
  database:
    image: postgres:16-alpine
    container_name: VirtualLabDatabase
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - virtual_lab_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1g

  # ── Backend API (Express) ───────────────────────────
  backend:
    build: ./backend
    container_name: VirtualLabBackend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PORT: ${API_PORT}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
    volumes:
      # Content-addressed archives. Written here, served by nginx.
      - virtual_lab_archives:/srv/archives
      # Per-asset store for streamed scenarios — the same idea at a finer grain.
      - virtual_lab_assets:/srv/assets
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:${API_PORT}/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m

  # ── Nginx + Frontend ────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: VirtualLabFrontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    volumes:
      # Read-only: nginx serves archives, Express never streams their bytes.
      - virtual_lab_archives:/srv/archives:ro
      - virtual_lab_assets:/srv/assets:ro
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m

volumes:
  virtual_lab_pgdata:
    name: virtual_lab_pgdata
  virtual_lab_archives:
    name: virtual_lab_archives
  virtual_lab_assets:
    name: virtual_lab_assets
