# nginx/csp-editor.conf — the Content Security Policy for /editor/ only.
#
# A separate policy so that whatever an authoring tool needs is never granted
# to the pages students open. Starts as csp.conf with one difference, and every
# further loosening belongs here, with its reason, not there.
#
#   fonts.googleapis.com / fonts.gstatic.com
#                           the editor's index.html links Inter and JetBrains
#                           Mono from Google Fonts. Remove both hosts once the
#                           fonts are self-hosted.
#
# Expected to grow: compiling scenario TypeScript in the browser will need
# 'wasm-unsafe-eval' in script-src. Not granted until something uses it.

add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob: 'nonce-$request_id'; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self'; worker-src 'self' blob:; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
