# nginx/editor.conf — routes /editor/ to the scenario editor's container.
#
# Not part of the image: docker-compose.editor.yml mounts it into
# /etc/nginx/server.d/, which nginx.conf includes inside its server block.
# Without that override this file is never loaded and `editor` is never
# resolved — a static upstream name that does not exist would stop nginx.
#
# Same origin as the catalog on purpose. The editor publishes through /api/,
# and the platform's CSP allows `connect-src 'self'` only.

# Spelled out with $http_host: a bare path makes nginx build the absolute URL
# from its own listen port (80), dropping the published one.
location = /editor {
    return 301 $scheme://$http_host/editor/;
}

# `^~` for the same reason as /scenarios/: without it the static-asset regex
# block in nginx.conf wins for the editor's .js and .css and serves them from
# the catalog's root.
location ^~ /editor/ {
    # Resolved per request through Docker's DNS, not once at startup: with a
    # literal upstream nginx keeps the address it saw when it booted, and
    # rebuilding the editor container alone left /editor/ hanging on the old one.
    # With a variable, proxy_pass forwards the request URI unchanged.
    resolver           127.0.0.11 valid=10s;
    set $editor_upstream http://editor:80;
    proxy_pass         $editor_upstream;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;

    # The editor's index.html still carries an inline import map, which csp-editor.conf allows by
    # nonce only (Chromium ignores CSP hashes for import maps). The header and this filter agree on
    # the same $request_id: both are evaluated once per response. The platform page has no import
    # map and no filter; this is the only place one is applied.
    sub_filter         '<script type="importmap">' '<script type="importmap" nonce="$request_id">';
    sub_filter_once    on;
    sub_filter_types   text/html;

    # sub_filter cannot read a compressed body — so ask the upstream for plain text.
    proxy_set_header   Accept-Encoding "";

    # Never cached at this level: index.html and hashed bundles share the
    # prefix, and a stale shell would keep loading a bundle that is gone.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy       "same-origin" always;
    add_header X-Frame-Options       "SAMEORIGIN" always;
    include /etc/nginx/csp-editor.conf;
}
