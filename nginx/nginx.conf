# nginx/nginx.conf

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Архіви сценаріїв можуть бути великими (upload у Фазі 2).
    client_max_body_size 512m;

    # ── Security headers ──────────────────────────────
    # NB: add_header does not inherit into a location that declares its own,
    # so these are repeated in the locations below that set Cache-Control.
    #
    # The CSP itself lives in csp.conf — it is long, and it has to be repeated
    # in every location that sets headers of its own.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy       "same-origin" always;
    add_header X-Frame-Options       "SAMEORIGIN" always;
    include /etc/nginx/csp.conf;

    # No sub_filter here. The platform page has no import map and no inline script: it runs no
    # scenario code (scenarios run in the sandboxed player under /player/). The one page that still
    # needs a nonce stamped onto its import map is the editor, so the filter lives in editor.conf,
    # in `location ^~ /editor/`, and nowhere else.

    # ── Optional locations ────────────────────────────
    # Empty in the base stack. docker-compose.editor.yml mounts editor.conf
    # here; a wildcard include that matches nothing is not an error.
    include /etc/nginx/server.d/*.conf;

    # ── SPA fallback ──────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The SPA shell must not be cached, or a stale bundle keeps talking to a
    # newer API. Hashed assets below stay immutable.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy       "same-origin" always;
        add_header X-Frame-Options       "SAMEORIGIN" always;
        include /etc/nginx/csp.conf;
    }

    # -- The scenario player (sandboxed frame) -------------
    # player.html / player.js are served with the headers the ENGINE ships
    # (player.nginx.conf, copied into the image by Dockerfile.frontend): two
    # exact-match locations, `= /player/player.html` and `= /player/player.js`.
    # An exact match beats the static-asset regex block below, so player.js is
    # never given the platform CSP by mistake. The player's CSP is its own and
    # there is no X-Frame-Options here: frame-ancestors 'self' in that CSP does
    # the job, and the platform's SAMEORIGIN is not wanted on the frame.
    include /etc/nginx/snippets/player.nginx.conf;

    # Anything else under /player/ is not part of the player: refuse it, so the
    # SPA fallback can never answer here with index.html (the platform page
    # inside a place that is meant to be opaque).
    location ^~ /player/ {
        return 404;
    }

    # -- Engine bundle and Basis transcoder ----------------
    # The sandboxed frame's origin is the string `null`, so everything it loads
    # from this server is cross-origin: it needs `ACAO: *` (public static files;
    # echoing `null` back would be worse). Same headers the regex block below
    # would have given them, plus that one.
    location = /assets/WebEngineTS.standalone.js {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy       "same-origin" always;
        add_header X-Frame-Options       "SAMEORIGIN" always;
        include /etc/nginx/csp.conf;
    }

    location ^~ /assets/basis/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy       "same-origin" always;
        add_header X-Frame-Options       "SAMEORIGIN" always;
        include /etc/nginx/csp.conf;
    }

    # ── Scenario archives ─────────────────────────────
    # Content-addressed: the filename is the sha256 of the bytes, so the object
    # can never change and may be cached forever.
    #
    # `^~` matters: without it the regex block below (which matches .zip) would
    # win over this prefix location and serve from the SPA root instead.
    location ^~ /scenarios/ {
        alias /srv/archives/objects/;

        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy       "same-origin" always;
        add_header X-Frame-Options       "SAMEORIGIN" always;
        include /etc/nginx/csp.conf;

        types { }
        default_type application/zip;

        # nginx already sends Accept-Ranges for static files, so range requests
        # (resumable downloads) work without extra configuration here.
    }

    # ── Streamed scenario assets ──────────────────────
    # The per-asset counterpart of /scenarios/: a scenario served as a manifest
    # of individually-fetchable scripts and assets rather than as one ZIP.
    #
    # Layout under /srv/assets:
    #   <scenario id>.json                the manifest the engine reads
    #   objects/<2 chars>/<sha256>.<ext>  content-addressed, shared, immutable
    #
    # **The manifest sits one level above objects/, and that is load-bearing.**
    # The engine resolves an asset URL by joining it onto the manifest's own
    # directory as a string — it does not treat a leading "/" as absolute. So a
    # manifest at /a/<id>.json makes the relative `objects/aa/…` it contains
    # resolve to /a/objects/aa/…, and no `baseUrl` option is needed by anyone
    # fetching it. Putting manifests in a subdirectory instead produced
    # /a/manifests//a/objects/… and a 404.
    #
    # Two-level sharding, matching what ScenarioCreator emits: one release is
    # already ~100 objects and a flat directory does not stay reasonable.
    #
    # Unlike /scenarios/ this must NOT force one content type — the manifest is
    # JSON and the scripts are ES modules, which a browser refuses to execute
    # when they arrive as application/zip.

    # Longer prefix wins, so objects are matched here rather than by /a/ below.
    # The name is the content hash, so these can be cached forever.
    location ^~ /a/objects/ {
        alias /srv/assets/objects/;

        types {
            text/javascript     js;
            image/ktx2          ktx2;
            application/wasm    wasm;
            model/gltf-binary   glb;
            image/jpeg          jpg jpeg;
            image/png           png;
            application/json    json;
        }
        default_type application/octet-stream;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy       "same-origin" always;
        add_header X-Frame-Options       "SAMEORIGIN" always;
        include /etc/nginx/csp.conf;
    }

    # Manifests. Named for the scenario rather than its content, so republishing
    # rewrites one in place — it must not be cached the way an object is.
    location ^~ /a/ {
        alias /srv/assets/;

        types { application/json json; }
        default_type application/json;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy       "same-origin" always;
        add_header X-Frame-Options       "SAMEORIGIN" always;
        include /etc/nginx/csp.conf;
    }

    # ── LTI endpoints ─────────────────────────────────
    # Same proxy as /api/, but WITHOUT the server-level X-Frame-Options and CSP: an LMS shows the
    # registration page in its own iframe and that page carries an inline script, so both would be
    # blocked. The LTI router sets a strict CSP of its own on every response (default-src 'none';
    # the registration page widens it to its nonce and to the platform's origin as frame ancestor).
    location ^~ /api/lti/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy       "same-origin" always;
    }

    # ── API proxy ─────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Скачування архіву триває довше за дефолтні 60s.
        proxy_connect_timeout 15s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Стрімимо архів як є, без буферизації всього тіла на диск.
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ── Кэширование статики ───────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|zip|ktx2|wasm|glb)$ {
        # One Cache-Control only — `expires` would emit a second, separate header.
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy       "same-origin" always;
        add_header X-Frame-Options       "SAMEORIGIN" always;
        include /etc/nginx/csp.conf;
    }

    # ── Gzip ──────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
