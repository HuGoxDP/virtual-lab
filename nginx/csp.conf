# nginx/csp.conf — the Content Security Policy, in one place.
#
# Included by the server block and by every location in nginx.conf that sets
# headers of its own: `add_header` does not inherit into those, so a location
# that declares one Cache-Control silently drops every server-level header.
# Adding a location and forgetting this line is the easy mistake; e2e/tests/
# csp.spec.ts checks the archive and manifest locations for exactly that.
#
# Every loosening was measured against the running app, not guessed — see
# docs/PLAN.md for the violation report it came from.
#
# The platform page runs NO scenario code: scenarios run in a sandboxed frame
# (/player/player.html, opaque origin, its own CSP from the engine's
# player.nginx.conf). So `script-src` is `'self'` alone: no `blob:` (the engine's
# blob-URL script execution happens inside the frame, under the player's policy)
# and no nonce (the inline import map that needed it is gone from index.html;
# /editor/ keeps both, under csp-editor.conf).
#
#   script-src 'self'       the Angular bundle and nothing else.
#   script-src-attr 'none'  no inline event handlers. Angular's critical-CSS
#                           inliner emits one, so it is off in angular.json.
#   style-src 'unsafe-inline'  Angular injects component styles as <style>
#                           elements at run time. They cannot be hashed ahead of
#                           time, and a nonce would have to reach Angular.
#   img-src 'self' data: blob:  decoded textures, and cover images, which are uploaded to the
#                           platform's own /previews/ store (a catalog row's imageUrl may
#                           only be a same-origin path; migration 010 cleared the off-origin
#                           ones). No https: - a cover can no longer be hot-linked.
#   worker-src blob:        precautionary; nothing spawns one today.
#   frame-src 'self'        the viewer embeds /player/player.html in a sandboxed
#                           iframe. Same host only; nothing else may be framed.
#
# **Deliberately absent: 'unsafe-eval'.** The KTX2 basis transcoder needs it —
# measured: 'wasm-unsafe-eval' alone gets the module compiled and then fails,
# because the Emscripten glue evaluates a string. The transcoder runs inside the
# player frame, whose own CSP carries 'unsafe-eval'; the platform page never
# needs it, and e2e/tests/csp.spec.ts keeps it absent here.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'self'; frame-ancestors 'self'" always;
